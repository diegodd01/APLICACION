<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente de Correo - TP Redes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>✉ Cliente de Correo</h1>
      <span id="estado" class="estado">Listo</span>
    </header>

    <section class="card">
      <h2>Redactar mensaje</h2>
      <input id="to" type="text" placeholder="Destinatario">
      <input id="subject" type="text" placeholder="Asunto">
      <textarea id="text" rows="5" placeholder="Escribí tu mensaje..."></textarea>
      <div class="acciones">
        <button class="btn primary" onclick="enviar()">Enviar</button>
        <button class="btn" onclick="limpiar()">Limpiar</button>
      </div>
    </section>

    <section class="card">
      <h2>Bandeja de entrada</h2>
      <div class="filtros">
        <select id="protocol" onchange="cargar()">
          <option value="imap">IMAP</option>
          <option value="pop3">POP3</option>
        </select>
        <select id="campo" onchange="cargar()">
          <option value="BODY">Cuerpo</option>
          <option value="FROM">Remitente</option>
          <option value="TO">Destinatario</option>
          <option value="SUBJECT">Asunto</option>
        </select>
        <input id="desde" type="date" onchange="cargar()">
      </div>
      <input id="q" type="search" placeholder="Buscar..." oninput="buscar()">
      <div id="lista" class="lista"><p class="vacio">Cargando...</p></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
